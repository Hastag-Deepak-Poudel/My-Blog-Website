<div class="col-md-3">
  <div class="dashboard-sidebar">
    <div class="dashboard-sidebar-head">
      {% if user.is_authenticated %}
      <div class="dashboard-sidebar-avatar">{{ user.username|first|upper }}</div>
      <span class="dashboard-sidebar-name">{{ user.get_full_name|default:user.username }}</span>
      {% endif %}
    </div>

    <nav class="dashboard-sidebar-nav">
      <a href="{% url 'dashboard' %}" class="dashboard-sidebar-link {% if '/dashboard/' in request.path %}active{% endif %}">
        <i class="fa fa-tachometer"></i> Dashboard
      </a>

      {% if perms.auth.view_user %}
      <a href="{% url 'users' %}" class="dashboard-sidebar-link {% if '/users/' in request.path %}active{% endif %}">
        <i class="fa fa-users"></i> Users
      </a>
      {% endif %}

      <a href="{% url 'categories' %}" class="dashboard-sidebar-link {% if '/categories/' in request.path %}active{% endif %}">
        <i class="fa fa-folder"></i> Categories
      </a>

      <a href="{% url 'posts' %}" class="dashboard-sidebar-link {% if '/posts/' in request.path %}active{% endif %}">
        <i class="fa fa-file-text"></i> Posts
      </a>

      <a href="{% url 'logout' %}" class="dashboard-sidebar-link dashboard-sidebar-logout">
        <i class="fa fa-sign-out"></i> Logout
      </a>
    </nav>
  </div>
</div>
