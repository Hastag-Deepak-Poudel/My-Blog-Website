{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}

<div class="row">
  <!-- Left sidebar -->
  {% include 'dashboard/sidebar.html' %}

  <!-- Right side content -->
  <div class="col-md-9">
    <div class="dashboard-content">
      <div class="dashboard-header">
        <h2 class="dashboard-title"><i class="fa fa-pencil-square"></i> Edit Blog Post</h2>
        <p class="dashboard-subtitle">Update the details of this blog post</p>
      </div>

      <form action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data" class="dashboard-form dashboard-form-wide">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-warning dashboard-submit">
          <i class="fa fa-check"></i> Update
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
