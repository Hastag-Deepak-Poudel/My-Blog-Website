{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}

<div class="row">
  <!-- Left sidebar -->
  {% include 'dashboard/sidebar.html' %}

  <!-- Right side content -->
  <div class="col-md-9">
    <div class="dashboard-content">
      <div class="dashboard-header">
        <h2 class="dashboard-title"><i class="fa fa-pencil"></i> Edit Category</h2>
        <p class="dashboard-subtitle">Update the details for this category</p>
      </div>

      <form action="{% url 'edit_category' category.id %}" method="POST" class="dashboard-form">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-warning dashboard-submit">
          <i class="fa fa-check"></i> Update
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
