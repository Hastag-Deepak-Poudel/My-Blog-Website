<!-- Header Part -->
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-Culture Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-4 pt-1">
            <a class="blog-header-logo text-dark" href="/">Lets-Escape</a>
          </div>
          <div class="col-4 header-search">
            <form action="{% url 'search' %}" method="GET">
              <div class="input-group">
                <input class="form-control" type="text" name="keyword" value="{{ keyword }}" placeholder="Search articles..." aria-label="Enter search term..." />
                <div class="input-group-append">
                  <button type="submit" class="btn btn-warning"><i class="fa fa-search"></i> Go!</button>
                </div>
              </div>
            </form>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center auth-links">
            {% if not user.is_authenticated %}
            <a class="btn btn-sm btn-warning" href="{% url 'login' %}">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
            {% else %}
            <a class="dashboard-link" href="{% url 'dashboard' %}"><i class="fa fa-tachometer"></i> Dashboard</a>
            &emsp;
            <a class="logout-link" href="{% url 'logout' %}"><i class="fa fa-sign-out"></i> Logout</a>
            {% endif %}
          </div>
        </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' cat.id %}">{{ cat.category_name }}</a>
          {% endfor %}
        </nav>
      </div>

<!-- Main Content Part -->
{% block content %}

{% endblock %}

<!-- Footer Part -->
<footer class="blog-footer">
    <p class="blog-copyright">&copy; <span id="copyright-year"></span> lets-escape. All rights reserved.</p>
    Created by Deepak
    <div class="blog-footer-links">
        <a href="https://www.instagram.com/hashtag_dipak" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram">
            <i class="fa fa-instagram"></i>
        </a>
        <a href="https://github.com/Hastag-Deepak-Poudel" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
            <i class="fa fa-github"></i>
        </a>
        <a href="https://deepak-poudel.com.np" target="_blank" rel="noopener" title="Portfolio" aria-label="Portfolio">
            <i class="fa fa-globe"></i>
        </a>
    </div>
</footer>
<script>
    document.getElementById('copyright-year').textContent = new Date().getFullYear();
</script>
    </div>
</body>
</html>
